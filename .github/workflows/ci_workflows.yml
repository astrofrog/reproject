name: Windows Python 3.13 CI

on:
  push:
  pull_request:

jobs:
  test-windows-py313:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python version
        run: python --version
      - name: Header
        run: cat /hostedtoolcache/windows/Python/3.13.4/x64/include/Python.h
        shell: bash
